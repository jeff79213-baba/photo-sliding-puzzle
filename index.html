<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>相簿華容道</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  overscroll-behavior: none; overflow: hidden; height: 100%; width: 100%;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e; color: #eee; display: flex;
  flex-direction: column; align-items: center;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.close-btn {
  position: fixed; top: 12px; left: 12px; z-index: 100;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(0,0,0,.5); border: none; color: #fff;
  font-size: 1.4rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.close-btn:active { background: rgba(0,0,0,.7); }
h1 {
  font-size: 1.4rem; padding: 14px 0 6px; text-align: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.controls {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  padding: 6px 12px; width: 100%; max-width: 500px;
}
.controls button, .controls label {
  background: #16213e; color: #eee; border: 1px solid #0f3460;
  padding: 8px 14px; border-radius: 10px; font-size: 0.9rem;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.controls button:active { transform: scale(0.95); }
.controls button.primary { background: #e94560; border-color: #e94560; }
.controls button.success { background: #0f3460; border-color: #0f3460; }
#fileInput { display: none; }
.grid-selector { display: flex; gap: 6px; align-items: center; }
.grid-selector span { font-size: 0.85rem; opacity: .8; }
.grid-btn { padding: 4px 12px; border-radius: 8px; font-size: 0.85rem; }
.grid-btn.active { background: #e94560; border-color: #e94560; }
.puzzle-container {
  position: relative; width: 92vw; max-width: 420px; margin: 8px auto; flex: 1;
  display: flex; flex-direction: column; justify-content: center;
}
.puzzle-wrapper {
  position: relative; width: 100%; padding-bottom: 100%; overflow: hidden;
  border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
  background: #0f3460;
}
#puzzle {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: grid; gap: 3px; padding: 3px;
  touch-action: none;
}
.tile {
  position: relative; border-radius: 4px; cursor: pointer;
  background-size: cover; background-position: center;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
.tile.empty { opacity: 0; pointer-events: none; }
.tile.correct {
  box-shadow: inset 0 0 0 2px rgba(102, 126, 234, .5);
}
.win-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.7); display: none; flex-direction: column;
  align-items: center; justify-content: center; border-radius: 12px;
  z-index: 10;
}
.win-overlay.show { display: flex; }
.win-overlay h2 { font-size: 1.8rem; margin-bottom: 6px; }
.win-overlay p { font-size: 1rem; opacity: .9; margin-bottom: 14px; }
.win-overlay button {
  background: #e94560; color: #fff; border: none; padding: 10px 28px;
  border-radius: 12px; font-size: 1.1rem; cursor: pointer;
}
.stats {
  display: flex; gap: 16px; font-size: 0.85rem; opacity: .8;
  padding: 4px 0;
}
.hint-text {
  text-align: center; padding: 6px 12px 10px; font-size: 0.85rem;
  opacity: .6; line-height: 1.5;
}
.ref-img-container {
  width: 92vw; max-width: 420px; margin: 6px auto 0; display: none;
}
.ref-img-container.show { display: block; }
.ref-img-container summary {
  cursor: pointer; font-size: 0.85rem; opacity: .6; padding: 2px 0;
}
#refImage { width: 100%; border-radius: 8px; }
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">✕</button>
<h1>📸 相簿華容道</h1>

<div class="controls">
  <label for="fileInput" class="primary">📷 選擇照片</label>
  <input type="file" id="fileInput" accept="image/*">
  <button class="success" id="shuffleBtn">🔀 打亂</button>
</div>

<div class="controls">
  <div class="grid-selector">
    <span>尺寸：</span>
    <button class="grid-btn active" data-size="3">3×3</button>
    <button class="grid-btn" data-size="4">4×4</button>
  </div>
  <button id="resetBtn">⟳ 重新開始</button>
</div>

<div class="stats">
  <span>步數：<strong id="moveCount">0</strong></span>
  <span>時間：<strong id="timer">00:00</strong></span>
</div>

<div class="puzzle-container">
  <div class="puzzle-wrapper">
    <div id="puzzle"></div>
    <div class="win-overlay" id="winOverlay">
      <h2>🎉 恭喜過關！</h2>
      <p id="winInfo"></p>
      <button id="winContinueBtn">繼續挑戰</button>
    </div>
  </div>
</div>

<details class="ref-img-container" id="refContainer">
  <summary>🖼 顯示原圖參考</summary>
  <img id="refImage" alt="原圖">
</details>

<div class="hint-text">
  點擊空格旁邊的區塊就能滑動<br>
  💡 先選照片 → 再按 <strong>打亂</strong> 開始
</div>

<script>
const puzzle = document.getElementById('puzzle');
const fileInput = document.getElementById('fileInput');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');
const moveCountEl = document.getElementById('moveCount');
const timerEl = document.getElementById('timer');
const winOverlay = document.getElementById('winOverlay');
const winInfo = document.getElementById('winInfo');
const winContinueBtn = document.getElementById('winContinueBtn');
const refContainer = document.getElementById('refContainer');
const refImage = document.getElementById('refImage');
const gridBtns = document.querySelectorAll('.grid-btn');
const closeBtn = document.getElementById('closeBtn');

let gridSize = 3;
let tiles = [];
let emptyIndex = 0;
let moves = 0;
let timerInterval = null;
let seconds = 0;
let sourceImage = null;
let isWin = false;
let isMoving = false;

closeBtn.addEventListener('click', () => {
  if (window.history.length > 1) { window.history.back(); }
  else { window.location.href = 'about:blank'; }
});

function getTotalTiles() { return gridSize * gridSize; }

function initSolvedState() {
  const total = getTotalTiles();
  tiles = Array.from({ length: total }, (_, i) => i);
  emptyIndex = total - 1;
  moves = 0;
  isWin = false;
  isMoving = false;
  moveCountEl.textContent = '0';
  stopTimer();
  seconds = 0;
  timerEl.textContent = '00:00';
  winOverlay.classList.remove('show');
}

function isAdjacent(i, j) {
  const n = gridSize;
  const ri = Math.floor(i / n), ci = i % n;
  const rj = Math.floor(j / n), cj = j % n;
  return (Math.abs(ri - rj) + Math.abs(ci - cj)) === 1;
}

function swap(i, j) {
  [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
}

function getValidMoves() {
  const n = gridSize;
  const row = Math.floor(emptyIndex / n);
  const col = emptyIndex % n;
  const result = [];
  if (row > 0) result.push(emptyIndex - n);
  if (row < n - 1) result.push(emptyIndex + n);
  if (col > 0) result.push(emptyIndex - 1);
  if (col < n - 1) result.push(emptyIndex + 1);
  return result;
}

function shuffle(times) {
  initSolvedState();
  const total = getTotalTiles();
  const iterations = times || total * 50;
  for (let k = 0; k < iterations; k++) {
    const valid = getValidMoves();
    const pick = valid[Math.floor(Math.random() * valid.length)];
    swap(emptyIndex, pick);
    emptyIndex = pick;
  }
  moves = 0;
  moveCountEl.textContent = '0';
  if (checkWin()) shuffle(times);
}

function checkWin() {
  const total = getTotalTiles();
  for (let i = 0; i < total; i++) {
    if (tiles[i] !== i) return false;
  }
  return true;
}

function getTilePos(index) {
  const row = Math.floor(index / gridSize);
  const col = index % gridSize;
  const step = gridSize > 1 ? 100 / (gridSize - 1) : 0;
  return { x: col * step, y: row * step };
}

function render() {
  const total = getTotalTiles();
  puzzle.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

  if (!sourceImage) {
    puzzle.innerHTML = '<div style="grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;color:#555;font-size:1rem;">請先選擇一張照片</div>';
    return;
  }

  puzzle.innerHTML = '';
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < total; i++) {
    const div = document.createElement('div');
    div.className = 'tile';
    div.dataset.index = i;

    const val = tiles[i];
    if (val === total - 1) {
      div.classList.add('empty');
    } else {
      const pos = getTilePos(val);
      div.style.backgroundImage = `url(${sourceImage})`;
      div.style.backgroundSize = `${gridSize * 100}%`;
      div.style.backgroundPosition = `${pos.x}% ${pos.y}%`;
      if (val === i) div.classList.add('correct');
    }

    div.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleTileClick(i);
    }, { passive: false });
    div.addEventListener('mousedown', () => handleTileClick(i));

    fragment.appendChild(div);
  }
  puzzle.appendChild(fragment);
}

function handleTileClick(index) {
  if (isMoving || isWin) return;
  if (!sourceImage) return;
  if (index === emptyIndex) return;
  if (!isAdjacent(index, emptyIndex)) return;

  isMoving = true;
  if (!timerInterval) startTimer();

  swap(index, emptyIndex);
  emptyIndex = index;
  moves++;
  moveCountEl.textContent = moves;
  render();

  if (checkWin()) {
    isWin = true;
    stopTimer();
    setTimeout(() => {
      winInfo.textContent = `👏 ${gridSize}×${gridSize} · ${moves}步 · ${timerEl.textContent}`;
      winOverlay.classList.add('show');
      isMoving = false;
    }, 300);
  } else {
    setTimeout(() => { isMoving = false; }, 100);
  }
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function loadImage(imgSrc) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const size = Math.min(img.width, img.height);
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, size, size);
    sourceImage = canvas.toDataURL('image/jpeg', 0.92);
    refImage.src = sourceImage;
    refContainer.classList.add('show');
    initSolvedState();
    render();
  };
  img.src = imgSrc;
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadImage(ev.target.result);
  reader.readAsDataURL(file);
  fileInput.value = '';
});

shuffleBtn.addEventListener('click', () => {
  if (!sourceImage) { alert('請先選擇一張照片！'); return; }
  shuffle();
  render();
});

resetBtn.addEventListener('click', () => {
  if (!sourceImage) { alert('請先選擇一張照片！'); return; }
  initSolvedState();
  render();
});

winContinueBtn.addEventListener('click', () => {
  shuffle();
  render();
});

gridBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    gridBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gridSize = parseInt(btn.dataset.size);
    if (sourceImage) {
      initSolvedState();
      render();
    }
  });
});

initSolvedState();
render();
</script>
</body>
</html>
