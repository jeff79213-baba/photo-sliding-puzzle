<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>相簿華容道</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  overscroll-behavior: none; overflow: hidden; height: 100%; width: 100%;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e; color: #eee; display: flex;
  flex-direction: column; align-items: center;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.close-btn {
  position: fixed; top: 12px; left: 12px; z-index: 100;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(0,0,0,.5); border: none; color: #fff;
  font-size: 1.4rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.close-btn:active { background: rgba(0,0,0,.7); }
h1 {
  font-size: 1.4rem; padding: 14px 0 6px; text-align: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.controls {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  padding: 6px 12px; width: 100%; max-width: 500px;
}
.controls button, .controls label {
  background: #16213e; color: #eee; border: 1px solid #0f3460;
  padding: 8px 14px; border-radius: 10px; font-size: 0.9rem;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.controls button:active { transform: scale(0.95); }
.controls button.primary { background: #e94560; border-color: #e94560; }
.controls button.success { background: #0f3460; border-color: #0f3460; }
.controls button.hint-active { background: #f0a500; border-color: #f0a500; color: #1a1a2e; }
.controls button.solving { background: #e94560; border-color: #e94560; }
#fileInput { display: none; }
.grid-selector { display: flex; gap: 6px; align-items: center; }
.grid-selector span { font-size: 0.85rem; opacity: .8; }
.grid-btn { padding: 4px 12px; border-radius: 8px; font-size: 0.85rem; }
.grid-btn.active { background: #e94560; border-color: #e94560; }
.puzzle-container {
  position: relative; width: 92vw; max-width: 420px; margin: 8px auto; flex: 1;
  display: flex; flex-direction: column; justify-content: center;
}
.puzzle-wrapper {
  position: relative; width: 100%; padding-bottom: 100%; overflow: hidden;
  border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
  background: #0f3460;
}
#puzzle {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: grid; gap: 3px; padding: 3px;
  touch-action: none;
}
.tile {
  position: relative; border-radius: 4px; cursor: pointer;
  background-size: cover; background-position: center;
  touch-action: none; -webkit-tap-highlight-color: transparent;
  transition: box-shadow .2s;
}
.tile.empty { opacity: 0; pointer-events: none; }
.tile.correct {
  box-shadow: inset 0 0 0 2px rgba(102, 126, 234, .5);
}
.tile.hint-wrong::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(233, 69, 96, .25); border-radius: 4px;
}
.tile.hint-correct::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(46, 213, 115, .15); border-radius: 4px;
}
.tile.hint-next {
  box-shadow: 0 0 16px 4px rgba(240, 165, 0, .7);
  z-index: 2;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 12px 2px rgba(240, 165, 0, .5); }
  50% { box-shadow: 0 0 20px 6px rgba(240, 165, 0, .9); }
}
.tile.hint-next-pulse {
  animation: pulse-glow .8s ease-in-out infinite;
  z-index: 2;
}
.status-msg {
  text-align: center; font-size: 0.8rem; padding: 4px 0; min-height: 20px;
  opacity: .7;
}
.status-msg.info { color: #f0a500; opacity: 1; }
.status-msg.done { color: #2ed573; opacity: 1; }
.win-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.7); display: none; flex-direction: column;
  align-items: center; justify-content: center; border-radius: 12px;
  z-index: 10;
}
.win-overlay.show { display: flex; }
.win-overlay h2 { font-size: 1.8rem; margin-bottom: 6px; }
.win-overlay p { font-size: 1rem; opacity: .9; margin-bottom: 14px; }
.win-overlay button {
  background: #e94560; color: #fff; border: none; padding: 10px 28px;
  border-radius: 12px; font-size: 1.1rem; cursor: pointer;
}
.stats {
  display: flex; gap: 16px; font-size: 0.85rem; opacity: .8;
  padding: 4px 0;
}
.hint-text {
  text-align: center; padding: 6px 12px 10px; font-size: 0.85rem;
  opacity: .6; line-height: 1.5;
}
.ref-img-container {
  width: 92vw; max-width: 420px; margin: 6px auto 0; display: none;
}
.ref-img-container.show { display: block; }
.ref-img-container summary {
  cursor: pointer; font-size: 0.85rem; opacity: .6; padding: 2px 0;
}
#refImage { width: 100%; border-radius: 8px; }
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">✕</button>
<h1>📸 相簿華容道</h1>

<div class="controls">
  <label for="fileInput" class="primary">📷 選擇照片</label>
  <input type="file" id="fileInput" accept="image/*">
  <button class="success" id="shuffleBtn">🔀 打亂</button>
</div>

<div class="controls">
  <div class="grid-selector">
    <span>尺寸：</span>
    <button class="grid-btn active" data-size="3">3×3</button>
    <button class="grid-btn" data-size="4">4×4</button>
  </div>
  <button id="resetBtn">⟳ 重新開始</button>
  <button id="hintBtn">💡 提示</button>
  <button id="autoSolveBtn">🤖 自動完成</button>
</div>

<div class="stats">
  <span>步數：<strong id="moveCount">0</strong></span>
  <span>時間：<strong id="timer">00:00</strong></span>
</div>

<div class="puzzle-container">
  <div class="puzzle-wrapper">
    <div id="puzzle"></div>
    <div class="win-overlay" id="winOverlay">
      <h2>🎉 恭喜過關！</h2>
      <p id="winInfo"></p>
      <button id="winContinueBtn">繼續挑戰</button>
    </div>
  </div>
</div>

<details class="ref-img-container" id="refContainer">
  <summary>🖼 顯示原圖參考</summary>
  <img id="refImage" alt="原圖">
</details>

<div class="status-msg" id="statusMsg"></div>

<div class="hint-text">
  點擊空格旁邊的區塊就能滑動<br>
  💡 先選照片 → 再按 <strong>打亂</strong> 開始
</div>

<script>
const puzzle = document.getElementById('puzzle');
const fileInput = document.getElementById('fileInput');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');
const moveCountEl = document.getElementById('moveCount');
const timerEl = document.getElementById('timer');
const winOverlay = document.getElementById('winOverlay');
const winInfo = document.getElementById('winInfo');
const winContinueBtn = document.getElementById('winContinueBtn');
const refContainer = document.getElementById('refContainer');
const refImage = document.getElementById('refImage');
const gridBtns = document.querySelectorAll('.grid-btn');
const closeBtn = document.getElementById('closeBtn');
const hintBtn = document.getElementById('hintBtn');
const autoSolveBtn = document.getElementById('autoSolveBtn');
const statusMsg = document.getElementById('statusMsg');

let gridSize = 3;
let tiles = [];
let emptyIndex = 0;
let moves = 0;
let timerInterval = null;
let seconds = 0;
let sourceImage = null;
let isWin = false;
let isMoving = false;
let hintMode = false;
let solutionPath = null;
let solving = false;
let solveTimer = null;

closeBtn.addEventListener('click', () => {
  if (window.history.length > 1) { window.history.back(); }
  else { window.location.href = 'about:blank'; }
});

function getTotalTiles() { return gridSize * gridSize; }

function initSolvedState() {
  const total = getTotalTiles();
  tiles = Array.from({ length: total }, (_, i) => i);
  emptyIndex = total - 1;
  moves = 0;
  isWin = false;
  isMoving = false;
  solutionPath = null;
  moveCountEl.textContent = '0';
  stopTimer();
  seconds = 0;
  timerEl.textContent = '00:00';
  winOverlay.classList.remove('show');
  statusMsg.textContent = '';
}

function isAdjacent(i, j) {
  const n = gridSize;
  const ri = Math.floor(i / n), ci = i % n;
  const rj = Math.floor(j / n), cj = j % n;
  return (Math.abs(ri - rj) + Math.abs(ci - cj)) === 1;
}

function swap(i, j) {
  [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
}

function getValidMoves() {
  const n = gridSize;
  const row = Math.floor(emptyIndex / n);
  const col = emptyIndex % n;
  const result = [];
  if (row > 0) result.push(emptyIndex - n);
  if (row < n - 1) result.push(emptyIndex + n);
  if (col > 0) result.push(emptyIndex - 1);
  if (col < n - 1) result.push(emptyIndex + 1);
  return result;
}

function shuffle(times) {
  stopAutoSolve();
  initSolvedState();
  const total = getTotalTiles();
  const iterations = times || total * 50;
  for (let k = 0; k < iterations; k++) {
    const valid = getValidMoves();
    const pick = valid[Math.floor(Math.random() * valid.length)];
    swap(emptyIndex, pick);
    emptyIndex = pick;
  }
  moves = 0;
  moveCountEl.textContent = '0';
  if (checkWin()) shuffle(times);
}

function checkWin() {
  const total = getTotalTiles();
  for (let i = 0; i < total; i++) {
    if (tiles[i] !== i) return false;
  }
  return true;
}

function getTilePos(index) {
  const row = Math.floor(index / gridSize);
  const col = index % gridSize;
  const step = gridSize > 1 ? 100 / (gridSize - 1) : 0;
  return { x: col * step, y: row * step };
}

// --- IDA* Solver ---
function solvePuzzle(startTiles, startEmpty, gs) {
  const total = gs * gs;

  function manhattan(state) {
    let d = 0;
    for (let i = 0; i < total; i++) {
      const v = state[i];
      if (v === total - 1) continue;
      d += Math.abs(Math.floor(v / gs) - Math.floor(i / gs)) +
           Math.abs((v % gs) - (i % gs));
    }
    return d;
  }

  function neighbors(ei) {
    const r = Math.floor(ei / gs), c = ei % gs;
    const res = [];
    if (r > 0) res.push(ei - gs);
    if (r < gs - 1) res.push(ei + gs);
    if (c > 0) res.push(ei - 1);
    if (c < gs - 1) res.push(ei + 1);
    return res;
  }

  const path = [];
  let bound = manhattan(startTiles);
  const maxBound = gs === 3 ? 120 : 200;

  function dfs(state, ei, depth, prev, b) {
    const f = depth + manhattan(state);
    if (f > b) return f;
    if (manhattan(state) === 0) return -1;

    let min = Infinity;
    const nbrs = neighbors(ei);
    for (const ni of nbrs) {
      if (ni === prev) continue;
      const next = state.slice();
      next[ei] = state[ni];
      next[ni] = state[ei];
      path.push(ni);
      const t = dfs(next, ni, depth + 1, ei, b);
      if (t === -1) return -1;
      if (t < min) min = t;
      path.pop();
      if (min === -1) return -1;
    }
    return min;
  }

  while (bound <= maxBound) {
    const t = dfs(startTiles, startEmpty, 0, null, bound);
    if (t === -1) return path;
    if (t === Infinity) break;
    bound = t;
  }
  return null;
}

// --- Auto Solve ---
function startAutoSolve() {
  if (!sourceImage) { alert('請先選擇一張照片！'); return; }
  if (isWin) return;
  if (solving) { stopAutoSolve(); return; }

  const currentTiles = [...tiles];
  const currentEmpty = emptyIndex;

  statusMsg.textContent = '🧮 計算解答中...';
  statusMsg.className = 'status-msg info';

  setTimeout(() => {
    const solution = solvePuzzle(currentTiles, currentEmpty, gridSize);
    if (!solution) {
      statusMsg.textContent = '⚠️ 無法找到解答，請重新打亂';
      statusMsg.className = 'status-msg';
      return;
    }

    statusMsg.textContent = `✅ 找到解答！共 ${solution.length} 步，開始自動執行...`;
    statusMsg.className = 'status-msg info';
    solving = true;
    autoSolveBtn.textContent = '⏹ 停止';
    autoSolveBtn.classList.add('solving');
    hintMode = false;
    hintBtn.classList.remove('hint-active');

    let step = 0;
    function doStep() {
      if (!solving) {
        autoSolveBtn.textContent = '🤖 自動完成';
        autoSolveBtn.classList.remove('solving');
        return;
      }
      if (step >= solution.length) {
        solving = false;
        autoSolveBtn.textContent = '🤖 自動完成';
        autoSolveBtn.classList.remove('solving');
        statusMsg.textContent = '🎉 自動完成！';
        statusMsg.className = 'status-msg done';
        if (checkWin()) {
          isWin = true;
          stopTimer();
          winInfo.textContent = `🤖 ${gridSize}×${gridSize} · ${moves}步 · ${timerEl.textContent}`;
          winOverlay.classList.add('show');
        }
        return;
      }

      if (!timerInterval) startTimer();

      const ni = solution[step];
      swap(emptyIndex, ni);
      emptyIndex = ni;
      moves++;
      moveCountEl.textContent = moves;
      render();
      step++;
      solveTimer = setTimeout(doStep, 200);
    }
    doStep();
  }, 50);
}

function stopAutoSolve() {
  solving = false;
  if (solveTimer) { clearTimeout(solveTimer); solveTimer = null; }
  autoSolveBtn.textContent = '🤖 自動完成';
  autoSolveBtn.classList.remove('solving');
  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';
  isMoving = false;
}

// --- Hint Mode ---
function toggleHint() {
  if (!sourceImage) { alert('請先選擇一張照片！'); return; }
  if (isWin) return;
  if (solving) stopAutoSolve();
  hintMode = !hintMode;
  hintBtn.classList.toggle('hint-active', hintMode);

  if (hintMode) {
    statusMsg.textContent = '💡 提示模式：綠色=正確位置，紅色=錯誤位置';
    statusMsg.className = 'status-msg info';
    computeHint();
  } else {
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';
    solutionPath = null;
    render();
  }
}

function computeHint() {
  if (!hintMode || isWin) return;
  const currentTiles = [...tiles];
  const currentEmpty = emptyIndex;
  setTimeout(() => {
    const sol = solvePuzzle(currentTiles, currentEmpty, gridSize);
    if (sol && sol.length > 0) {
      solutionPath = sol;
      render();
    }
  }, 30);
}

// --- Render ---
function render() {
  const total = getTotalTiles();
  puzzle.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

  if (!sourceImage) {
    puzzle.innerHTML = '<div style="grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;color:#555;font-size:1rem;">請先選擇一張照片</div>';
    return;
  }

  puzzle.innerHTML = '';
  const fragment = document.createDocumentFragment();

  let nextHintIndex = -1;
  if (hintMode && solutionPath && solutionPath.length > 0) {
    nextHintIndex = solutionPath[0];
  }

  for (let i = 0; i < total; i++) {
    const div = document.createElement('div');
    div.className = 'tile';
    div.dataset.index = i;

    const val = tiles[i];
    if (val === total - 1) {
      div.classList.add('empty');
    } else {
      const pos = getTilePos(val);
      div.style.backgroundImage = `url(${sourceImage})`;
      div.style.backgroundSize = `${gridSize * 100}%`;
      div.style.backgroundPosition = `${pos.x}% ${pos.y}%`;

      if (hintMode) {
        if (val === i) {
          div.classList.add('hint-correct');
        } else {
          div.classList.add('hint-wrong');
        }
        if (i === nextHintIndex) {
          div.classList.add('hint-next-pulse');
        }
      } else {
        if (val === i) div.classList.add('correct');
      }
    }

    div.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleTileClick(i);
    }, { passive: false });
    div.addEventListener('mousedown', () => handleTileClick(i));

    fragment.appendChild(div);
  }
  puzzle.appendChild(fragment);
}

function handleTileClick(index) {
  if (isMoving || isWin || solving) return;
  if (!sourceImage) return;
  if (index === emptyIndex) return;
  if (!isAdjacent(index, emptyIndex)) return;

  isMoving = true;
  if (!timerInterval) startTimer();

  swap(index, emptyIndex);
  emptyIndex = index;
  moves++;
  moveCountEl.textContent = moves;
  solutionPath = null;
  render();

  if (checkWin()) {
    isWin = true;
    stopTimer();
    statusMsg.textContent = '🎉 過關了！';
    statusMsg.className = 'status-msg done';
    setTimeout(() => {
      winInfo.textContent = `👏 ${gridSize}×${gridSize} · ${moves}步 · ${timerEl.textContent}`;
      winOverlay.classList.add('show');
      isMoving = false;
    }, 300);
  } else {
    if (hintMode) computeHint();
    setTimeout(() => { isMoving = false; }, 100);
  }
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function loadImage(imgSrc) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const size = Math.min(img.width, img.height);
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, size, size);
    sourceImage = canvas.toDataURL('image/jpeg', 0.92);
    refImage.src = sourceImage;
    refContainer.classList.add('show');
    hintMode = false;
    hintBtn.classList.remove('hint-active');
    stopAutoSolve();
    initSolvedState();
    render();
  };
  img.src = imgSrc;
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadImage(ev.target.result);
  reader.readAsDataURL(file);
  fileInput.value = '';
});

shuffleBtn.addEventListener('click', () => {
  if (!sourceImage) { alert('請先選擇一張照片！'); return; }
  shuffle();
  solutionPath = null;
  render();
  if (hintMode) computeHint();
});

resetBtn.addEventListener('click', () => {
  if (!sourceImage) { alert('請先選擇一張照片！'); return; }
  stopAutoSolve();
  initSolvedState();
  hintMode = false;
  hintBtn.classList.remove('hint-active');
  solutionPath = null;
  render();
});

winContinueBtn.addEventListener('click', () => {
  shuffle();
  solutionPath = null;
  render();
});

hintBtn.addEventListener('click', toggleHint);

autoSolveBtn.addEventListener('click', startAutoSolve);

gridBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    gridBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gridSize = parseInt(btn.dataset.size);
    if (sourceImage) {
      stopAutoSolve();
      initSolvedState();
      hintMode = false;
      hintBtn.classList.remove('hint-active');
      solutionPath = null;
      render();
    }
  });
});

initSolvedState();
render();
</script>
</body>
</html>
